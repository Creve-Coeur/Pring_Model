<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>普林格新四核轮动组合</title>
  <style>
    :root {
      --bg: #eef2f6;
      --panel: #ffffff;
      --ink: #111827;
      --muted: #667085;
      --line: #d7dee8;
      --accent: #9f3a2f;
      --accent-2: #0f766e;
      --accent-3: #a16207;
      --shadow: 0 18px 46px rgba(17, 24, 39, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(159, 58, 47, 0.08), transparent 34%),
        linear-gradient(315deg, rgba(15, 118, 110, 0.08), transparent 36%),
        var(--bg);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      letter-spacing: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 14px clamp(14px, 3vw, 28px);
      border-bottom: 1px solid rgba(215, 222, 232, 0.95);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 26px rgba(17, 24, 39, 0.08);
      backdrop-filter: blur(16px);
    }

    .brand-kicker {
      margin: 0 0 3px;
      color: var(--accent-2);
      font-size: 12px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 2.5vw, 30px);
      line-height: 1.2;
      font-weight: 900;
    }

    .module-tabs {
      display: flex;
      gap: 8px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
      overflow-x: auto;
    }

    .module-tab {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: #344054;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .module-tab:hover {
      background: #ffffff;
      border-color: rgba(15, 118, 110, 0.26);
      color: var(--accent-2);
    }

    .module-tab.active {
      background: #ffffff;
      border-color: rgba(159, 58, 47, 0.34);
      color: var(--accent);
      box-shadow: 0 8px 18px rgba(17, 24, 39, 0.08);
    }

    .workspace {
      padding: clamp(12px, 2vw, 22px);
    }

    .module-panel {
      display: none;
      min-height: calc(100vh - 96px);
    }

    .module-panel.active {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
    }

    .module-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
      padding: 10px 12px 10px 16px;
      border: 1px solid rgba(215, 222, 232, 0.92);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 10px 26px rgba(17, 24, 39, 0.08);
      backdrop-filter: blur(12px);
    }

    .module-title {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: baseline;
      min-width: 0;
    }

    .module-title h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.3;
      font-weight: 900;
    }

    .module-badge {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .module-badge.live {
      color: var(--accent-2);
    }

    .open-link {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: #344054;
      font-size: 13px;
      font-weight: 800;
    }

    .open-link:hover {
      border-color: rgba(15, 118, 110, 0.36);
      color: var(--accent-2);
    }

    .frame-shell {
      min-height: 0;
      border: 1px solid rgba(17, 24, 39, 0.12);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 182px);
      min-height: 660px;
      border: 0;
      background: #ffffff;
    }

    @media (max-width: 820px) {
      .topbar {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .module-tabs {
        width: 100%;
      }

      .module-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .open-link {
        width: 100%;
      }

      iframe {
        height: calc(100svh - 236px);
        min-height: 560px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="brand-kicker">红筹投资组合研究</p>
      <h1>普林格新四核轮动组合</h1>
    </div>
    <nav class="module-tabs" aria-label="组合模块">
      <button class="module-tab active" type="button" data-module="intro">组合介绍</button>
      <button class="module-tab" type="button" data-module="birth">组合的诞生过程</button>
      <button class="module-tab" type="button" data-module="live">实盘跟踪情况</button>
    </nav>
  </header>

  <main class="workspace">
    <section class="module-panel active" id="intro" aria-labelledby="intro-title">
      <div class="module-head">
        <div class="module-title">
          <h2 id="intro-title">组合介绍</h2>
          <span class="module-badge">静态报告</span>
        </div>
        <a class="open-link" href="组合介绍/index.html" target="_blank" rel="noreferrer">打开原页</a>
      </div>
      <div class="frame-shell">
        <iframe src="组合介绍/index.html" title="组合介绍"></iframe>
      </div>
    </section>

    <section class="module-panel" id="birth" aria-labelledby="birth-title">
      <div class="module-head">
        <div class="module-title">
          <h2 id="birth-title">组合的诞生过程</h2>
          <span class="module-badge">研究路演</span>
        </div>
        <a class="open-link" href="组合的诞生/index.html" target="_blank" rel="noreferrer">打开原页</a>
      </div>
      <div class="frame-shell">
        <iframe src="组合的诞生/index.html" title="组合的诞生过程" loading="lazy"></iframe>
      </div>
    </section>

    <section class="module-panel" id="live" aria-labelledby="live-title">
      <div class="module-head">
        <div class="module-title">
          <h2 id="live-title">实盘跟踪情况</h2>
          <span class="module-badge live">每日更新</span>
        </div>
        <a class="open-link" href="组合实盘追踪/index.html" target="_blank" rel="noreferrer">打开原页</a>
      </div>
      <div class="frame-shell">
        <iframe src="组合实盘追踪/index.html" title="实盘跟踪情况" loading="lazy"></iframe>
      </div>
    </section>
  </main>

  <script>
    const tabs = Array.from(document.querySelectorAll(".module-tab"));
    const panels = Array.from(document.querySelectorAll(".module-panel"));
    const moduleIds = new Set(panels.map((panel) => panel.id));

    function activateModule(moduleId, updateHash = true) {
      const nextId = moduleIds.has(moduleId) ? moduleId : "intro";
      tabs.forEach((tab) => {
        tab.classList.toggle("active", tab.dataset.module === nextId);
      });
      panels.forEach((panel) => {
        panel.classList.toggle("active", panel.id === nextId);
      });
      if (updateHash) {
        history.replaceState(null, "", `#${nextId}`);
      }
    }

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => activateModule(tab.dataset.module));
    });

    window.addEventListener("hashchange", () => {
      activateModule(location.hash.slice(1), false);
    });

    activateModule(location.hash.slice(1), false);
  </script>
</body>
</html>
